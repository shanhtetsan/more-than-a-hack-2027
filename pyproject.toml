[project]
name = "mtah-possession"
version = "0.1.0"
description = "More than a Hack 2027, Phase 1: frame-by-frame ball possession for BAR-ATH."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kloppy==3.18.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.1.0",
]

[project.scripts]
mtah-submit = "possession.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possession"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The organisers' files are vendored as-is; we never reformat them.
extend-exclude = ["evaluation", "starter", "games.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "notebook==7.6.3",
    "pytest==9.1.1",
    "ruff==0.17.2",
]
